# N64 RDP spike: standalone benchmark app for a plain iPhone (device only: MoltenVK's iOS release has no simulator
# slice). Separate from the shipping app on purpose: it compiles its own copy of mupen64plus with N64_RDP_SPIKE, links
# MoltenVK + paraLLEl-RDP + cxd4, and never touches DuoEmulator.xcodeproj or its Release build.
# Generate: cd Spikes/N64RDP/ios && xcodegen generate   (needs ThirdParty-src, see docs/n64-rdp-spike.md)
name: N64Bench
options:
  deploymentTarget:
    iOS: "26.0"
configFiles:
  Debug: ../../../Local.xcconfig
  Release: ../../../Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    GCC_OPTIMIZATION_LEVEL: "2"          # cores are optimised even in Debug, like CoreKit
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    GCC_C_LANGUAGE_STANDARD: gnu11
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SUPPORTED_PLATFORMS: iphoneos
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  N64Bench:
    type: application
    platform: iOS
    sources:
      - path: N64Bench
      - path: ../rom/n64_rdpbench.z64
        buildPhase: resources
      - path: ../../../Packages/CoreKit/Sources/N64Core/Resources/mupen64plus.ini
        buildPhase: resources
      - path: ../src
        excludes: ["cxd4_unit.c"]
      - path: ../src/cxd4_unit.c
        compilerFlags: ["-O3", "-DM64P_PLUGIN_API", "-I$(SRCROOT)/../../../ThirdParty-src/mupen64plus-rsp-cxd4"]
      - path: ../bench/bench_core.c
      - path: ../../../Packages/CoreKit/Sources/MUPEN64/mupen64plus-core/src
        excludes: ["main/main.c", "device/r4300/opcodes.md", "device/r4300/mips_instructions.def"]
      - path: ../../../Packages/CoreKit/Sources/MUPEN64/mupen64plus-core/subprojects
        excludes: ["**/*.h"]
      - path: ../../../Packages/CoreKit/Sources/MUPEN64/rsp-hle/src
        excludes: ["plugin.c"]
      - path: ../../../Packages/CoreKit/Sources/MUPEN64/glue/src
      - path: ../../../Packages/CoreKit/Sources/MUPEN64/glue/units
      - path: ../../../ThirdParty-src/parallel-rdp-standalone/parallel-rdp
        excludes: ["shaders/*.comp", "shaders/*.frag", "shaders/*.vert", "shaders/*.json", "shaders/*.h"]
      - path: ../../../ThirdParty-src/parallel-rdp-standalone/volk/volk.c
      - path: ../../../ThirdParty-src/parallel-rdp-standalone/vulkan
        excludes: ["device_fossilize.cpp", "renderdoc_capture.cpp", "wsi.cpp", "*.hpp"]
      - path: ../../../ThirdParty-src/parallel-rdp-standalone/util
        excludes: ["*.hpp"]
    dependencies:
      - framework: ../../../ThirdParty-src/moltenvk/MoltenVK/MoltenVK/static/MoltenVK.xcframework
        embed: false
      - sdk: Metal.framework
      - sdk: IOSurface.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: libz.tbd
      - sdk: libc++.tbd
    info:
      path: N64Bench/Info.plist
      properties:
        CFBundleDisplayName: N64 Bench
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iqlabs.duoemulator.n64bench
        SWIFT_OBJC_BRIDGING_HEADER: N64Bench/Bridging.h
        GCC_PREPROCESSOR_DEFINITIONS: ["NO_ASM", "NOCRYPT", "NOUNCRYPT", "NDEBUG", "N64_RDP_SPIKE"]
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../src
          - $(SRCROOT)/../bench
          - $(SRCROOT)/../../../Packages/CoreKit/Sources/MUPEN64/glue/shim
          - $(SRCROOT)/../../../Packages/CoreKit/Sources/MUPEN64/glue/include
          - $(SRCROOT)/../../../Packages/CoreKit/Sources/MUPEN64/mupen64plus-core/src
          - $(SRCROOT)/../../../Packages/CoreKit/Sources/MUPEN64/mupen64plus-core/src/api
          - $(SRCROOT)/../../../Packages/CoreKit/Sources/MUPEN64/mupen64plus-core/subprojects
          - $(SRCROOT)/../../../Packages/CoreKit/Sources/MUPEN64/mupen64plus-core/subprojects/md5
          - $(SRCROOT)/../../../Packages/CoreKit/Sources/MUPEN64/mupen64plus-core/subprojects/xxhash
          - $(SRCROOT)/../../../ThirdParty-src/parallel-rdp-standalone/parallel-rdp
          - $(SRCROOT)/../../../ThirdParty-src/parallel-rdp-standalone/volk
          - $(SRCROOT)/../../../ThirdParty-src/parallel-rdp-standalone/vulkan
          - $(SRCROOT)/../../../ThirdParty-src/parallel-rdp-standalone/vulkan-headers/include
          - $(SRCROOT)/../../../ThirdParty-src/parallel-rdp-standalone/util
        USE_HEADERMAP: NO
        OTHER_CFLAGS: ["-w", "-fno-strict-aliasing", "-include", "$(SRCROOT)/../src/volk_rename.h"]
schemes:
  N64Bench:
    build:
      targets:
        N64Bench: all
    run:
      config: Release        # measure optimised code even when started with Run from Xcode
