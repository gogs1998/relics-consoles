name: DuoEmulator
options:
  bundleIdPrefix: com.iqlabs
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
packages:
  DuoKit:
    url: https://github.com/gogs1998/iqlabs-duokit
    from: 0.1.2
  CoreKit:
    path: Packages/CoreKit
targets:
  DuoEmulator:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Resources/Demos/**", "Resources/Demos"]
      # Free homebrew demos (credits in Licenses/demos-credits.txt), copied as a folder: Demos/<file>.
      - path: App/Resources/Demos
        type: folder
        buildPhase: resources
    dependencies:
      - package: DuoKit
      - package: CoreKit
        product: CoreKit
      - package: CoreKit
        product: AresCore
      - package: CoreKit
        product: DSCore
      - package: CoreKit
        product: N64Core
    postBuildScripts:
      - name: Test ROMs (Debug only) and Release ROM check
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          APP="${TARGET_BUILD_DIR}/${WRAPPER_NAME}"
          if [ "${CONFIGURATION}" = "Debug" ]; then
            mkdir -p "${APP}/TestCarts"
            cp "${SRCROOT}"/TestROMs/build/*.nes "${SRCROOT}"/TestROMs/build/*.gb "${SRCROOT}"/TestROMs/build/*.gbc "${SRCROOT}"/TestROMs/build/*.gba "${SRCROOT}"/TestROMs/build/*.sfc "${SRCROOT}"/TestROMs/build/*.md "${SRCROOT}"/TestROMs/build/*.nds "${SRCROOT}"/TestROMs/build/*.z64 "${APP}/TestCarts/" 2>/dev/null || true
          else
            rm -rf "${APP}/TestCarts"
            # ROM check: the only game files allowed are the bundled homebrew demos and our own N64 speed-test ROM
            # (Tools/build_n64_bench_rom.py), by path and SHA-256.
            ALLOW=" Demos/ucity.gbc:9422ee2ca7b7ea1d46b58b2a429fff3f354dfd3e732dee1e7ae6220f148ce6e0 Demos/libbet.gb:3607412031c8287cf878299ce96e581e85b852dde703806343b95576fa3ff1a9 Demos/thwaite.nes:3543ebf804f80abb19acfde4630a909a7485e2d69487900fd93b5698c412adc5 Demos/croom.nes:6a43202f8b7793f78832c47b67ca3aeb12165140a1e38f0a5043855b2e3d53cd Demos/alexvsbus-pre3.md:1b05f681125445cfedf4cdc0819a79c9d372d5dc198cc36afbd61d6876161be1 CoreKit_N64Core.bundle/n64_rdpbench.z64:3dc16cfe0003ad2d555d9b6be97e6a64fccdd8a5382b37829310e66df1615c02 "
            LIST="${DERIVED_FILE_DIR}/rom-check.txt"
            mkdir -p "${DERIVED_FILE_DIR}"
            find "${APP}" \( -iname '*.nes' -o -iname '*.gb' -o -iname '*.gbc' -o -iname '*.gba' -o -iname '*.sfc' -o -iname '*.smc' -o -iname '*.md' -o -iname '*.gen' -o -iname '*.smd' -o -iname '*.nds' -o -iname '*.z64' -o -iname '*.n64' -o -iname '*.v64' -o -iname '*.zip' -o -iname '*.bin' -o -iname '*.rom' -o -iname '*.bios' \) -type f > "${LIST}"
            COUNT=0
            while IFS= read -r F; do
              REL="${F#${APP}/}"
              SUM=$(shasum -a 256 "${F}" | cut -d' ' -f1)
              case "${ALLOW}" in
                *" ${REL}:${SUM} "*) COUNT=$((COUNT + 1)) ;;
                *) echo "error: ROM file inside a Release bundle that is not an allowed demo: ${REL}"; exit 1 ;;
              esac
            done < "${LIST}"
            if [ "${COUNT}" -ne 6 ]; then echo "error: expected the 5 bundled demos and the N64 speed-test ROM, found ${COUNT}"; exit 1; fi
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iqlabs.duoemulator
        PRODUCT_NAME: DuoEmulator
        INFOPLIST_FILE: App/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "5"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # MoltenVK (Apache-2.0, ThirdParty/moltenvk) for the N64 RDP renderer: device builds only (no simulator slice).
        "OTHER_LDFLAGS[sdk=iphoneos*]": ["$(inherited)", "$(SRCROOT)/ThirdParty/moltenvk/ios-arm64/libMoltenVK.a",
                                         "-framework", "Metal", "-framework", "IOSurface", "-framework", "QuartzCore"]
  DuoEmulatorTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: DuoEmulator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iqlabs.duoemulator.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/DuoEmulator.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/DuoEmulator
  DuoEmulatorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: DuoEmulator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iqlabs.duoemulator.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: DuoEmulator
schemes:
  DuoEmulator:
    build:
      targets:
        DuoEmulator: all
        DuoEmulatorTests: [test]
        DuoEmulatorUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [DuoEmulatorTests, DuoEmulatorUITests]
    archive:
      config: Release
