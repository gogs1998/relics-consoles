name: DuoEmulator
options:
  bundleIdPrefix: com.iqlabs
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
packages:
  DuoKit:
    url: https://github.com/gogs1998/iqlabs-duokit
    from: 0.1.2
  CoreKit:
    path: Packages/CoreKit
targets:
  DuoEmulator:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: DuoKit
      - package: CoreKit
        product: CoreKit
      - package: CoreKit
        product: AresCore
      - package: CoreKit
        product: DSCore
      - package: CoreKit
        product: N64Core
    postBuildScripts:
      - name: Test ROMs (Debug only) and Release ROM check
        basedOnDependencyAnalysis: false
        script: |
          APP="${TARGET_BUILD_DIR}/${WRAPPER_NAME}"
          if [ "${CONFIGURATION}" = "Debug" ]; then
            mkdir -p "${APP}/TestCarts"
            cp "${SRCROOT}"/TestROMs/build/*.nes "${SRCROOT}"/TestROMs/build/*.gb "${SRCROOT}"/TestROMs/build/*.gbc "${SRCROOT}"/TestROMs/build/*.gba "${SRCROOT}"/TestROMs/build/*.sfc "${SRCROOT}"/TestROMs/build/*.md "${SRCROOT}"/TestROMs/build/*.nds "${SRCROOT}"/TestROMs/build/*.z64 "${APP}/TestCarts/" 2>/dev/null || true
          else
            rm -rf "${APP}/TestCarts"
            FOUND=$(find "${APP}" \( -iname '*.nes' -o -iname '*.gb' -o -iname '*.gbc' -o -iname '*.gba' -o -iname '*.sfc' -o -iname '*.smc' -o -iname '*.md' -o -iname '*.gen' -o -iname '*.smd' -o -iname '*.nds' -o -iname '*.z64' -o -iname '*.n64' -o -iname '*.v64' -o -iname '*.zip' -o -iname '*.bin' -o -iname '*.rom' -o -iname '*.bios' \) -not -path '*/Licences/*' | head -1)
            if [ -n "${FOUND}" ]; then echo "error: ROM file inside a Release bundle: ${FOUND}"; exit 1; fi
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iqlabs.duoemulator
        PRODUCT_NAME: DuoEmulator
        INFOPLIST_FILE: App/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
  DuoEmulatorTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: DuoEmulator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iqlabs.duoemulator.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/DuoEmulator.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/DuoEmulator
  DuoEmulatorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: DuoEmulator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iqlabs.duoemulator.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: DuoEmulator
schemes:
  DuoEmulator:
    build:
      targets:
        DuoEmulator: all
        DuoEmulatorTests: [test]
        DuoEmulatorUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [DuoEmulatorTests, DuoEmulatorUITests]
    archive:
      config: Release
